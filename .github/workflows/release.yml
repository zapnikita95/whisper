name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: VERSION from tag
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          echo "${GITHUB_REF#refs/tags/v}" > packaging/VERSION

      - name: Install deps
        run: python -m pip install -U pip wheel && pip install -r requirements.txt pyinstaller

      - name: PyInstaller (WhisperServer)
        shell: bash
        run: |
          set -e
          ICON_ARGS=()
          if [ -f assets/app_icon.ico ]; then ICON_ARGS=(--icon assets/app_icon.ico); fi
          python -m PyInstaller --noconfirm --clean --windowed --name WhisperServer \
            "${ICON_ARGS[@]}" \
            --collect-all uvicorn --collect-all fastapi --collect-all starlette \
            --hidden-import whisper_server --hidden-import whisper_models \
            --hidden-import whisper_model_hub --hidden-import whisper_system_profile \
            --hidden-import whisper_server_gui_models_tab \
            --hidden-import whisper_file_log \
            --hidden-import faster_whisper \
            --hidden-import whisper_version --hidden-import whisper_update_check \
            --add-data "packaging/VERSION;packaging" \
            whisper_server_gui.py

      - name: PyInstaller (WhisperHotkey)
        shell: bash
        run: |
          set -e
          ICON_ARGS=()
          ICO_DATA=()
          if [ -f assets/app_icon.ico ]; then
            ICON_ARGS=(--icon assets/app_icon.ico)
            ICO_DATA=(--add-data "assets/app_icon.ico;assets")
          fi
          python -m PyInstaller --noconfirm --clean --windowed --name WhisperHotkey \
            "${ICON_ARGS[@]}" \
            --hidden-import whisper_hotkey_core --hidden-import whisper_hotkey_tray \
            --hidden-import whisper_hotkey_history \
            --hidden-import whisper_hotkey_settings_win \
            --hidden-import whisper_groq --hidden-import whisper_vocab --hidden-import whisper_update_check \
            --hidden-import whisper_models --hidden-import whisper_model_hub --hidden-import whisper_system_profile \
            --hidden-import whisper_file_log \
            --hidden-import faster_whisper --hidden-import whisper_version \
            --hidden-import keyboard --hidden-import pyaudio --hidden-import pyperclip \
            --hidden-import soundfile --hidden-import numpy \
            --hidden-import plyer.platforms.win.notification \
            --hidden-import pystray --hidden-import PIL --hidden-import PIL.Image \
            --add-data "packaging/VERSION;packaging" \
            "${ICO_DATA[@]}" \
            whisper_hotkey_tray.py

      - name: Inno Setup (Chocolatey)
        run: choco install innosetup -y --no-progress

      - name: Compile .iss (Server + Hotkey)
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 5\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after choco install innosetup" }
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          & $iscc "packaging\windows\WhisperServer.iss" /DMyAppVersion=$env:VERSION
          & $iscc "packaging\windows\WhisperHotkey.iss" /DMyAppVersion=$env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-setup
          path: dist/release/WhisperSetup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-hotkey-setup
          path: dist/release/WhisperHotkeySetup-*.exe

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.13"

      - name: VERSION from tag
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          echo "${GITHUB_REF#refs/tags/v}" > packaging/VERSION

      - name: Build WhisperClient.app + DMG (Developer ID если заданы секреты)
        env:
          VERSION: ${{ env.VERSION }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          WHISPER_MAC_CODESIGN_IDENTITY: ${{ secrets.WHISPER_MAC_CODESIGN_IDENTITY }}
          APPLE_NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_SPECIFIC_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          WHISPER_BUNDLE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          WHISPER_STUB_ARCH_FLAGS: -arch arm64
        run: bash packaging/mac/ci_mac_signed_build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-dmg
          path: dist/release/WhisperClient-*.dmg

  publish:
    needs: [build-windows, build-macos]
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: whisper-*

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_files
          find artifacts -type f \( -name 'WhisperSetup-*.exe' -o -name 'WhisperHotkeySetup-*.exe' -o -name 'WhisperClient-*.dmg' \) -exec cp {} release_files/ \;
          ls -la release_files/

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
